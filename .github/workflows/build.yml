name: Build binaries

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to build (e.g., main)"
        required: true
        default: "main"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          sudo apt update
          if [ "${{ matrix.architecture }}" == "arm64" ]; then
            sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          else
            sudo apt install -y build-essential
          fi

      - run: |
          cd c_enet
          if [ "${{ matrix.architecture }}" == "arm64" ]; then
            cmake -S . -B build \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_BUILD_TYPE=Release \
              -DENET_SHARED=1
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DENET_SHARED=1
          fi
          cmake --build build
          cp build/libenet.so libenet.so

      - uses: actions/upload-artifact@v6
        with:
          name: enet-linux-${{ matrix.architecture }}
          path: c_enet/libenet.so

  build-osx:
    runs-on: macos-latest
    strategy:
      matrix:
        arch:
          - x64
          - arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_enet
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cmake -S . -B build \
              -DCMAKE_OSX_ARCHITECTURES="x86_64" \
              -DCMAKE_BUILD_TYPE=Release \
              -DENET_SHARED=1
          else
            cmake -S . -B build \
              -DCMAKE_OSX_ARCHITECTURES="arm64" \
              -DCMAKE_BUILD_TYPE=Release \
              -DENET_SHARED=1
          fi
          cmake --build build
          cp build/libenet.dylib libenet.dylib

      - uses: actions/upload-artifact@v6
        with:
          name: enet-osx-${{ matrix.arch }}
          path: c_enet/libenet.dylib

  build-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - uses: Source-Authors/msvc-dev-cmd@v2
        with:
          arch: x64

      - run: |
          cd c_enet
          cmake -S . -B build -DENET_SHARED=1
          cmake --build build --config Release
          copy build\Release\enet.dll enet.dll
          copy build\Release\enet.lib enet.lib
        shell: powershell

      - uses: actions/upload-artifact@v6
        with:
          name: enet-win-x64
          path: |
            c_enet\enet.dll
            c_enet\enet.lib

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target_dir: android-arm64
          - abi: x86_64
            target_dir: android-x64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: sudo apt update && sudo apt install -y unzip

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: false

      - env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd c_enet
          cmake -S . -B build/${{ matrix.abi }} \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ matrix.abi }} \
                -DANDROID_NATIVE_API_LEVEL=21 \
                -DCMAKE_BUILD_TYPE=Release \
                -DENET_SHARED=1
          cmake --build build/${{ matrix.abi }}
          cp build/${{ matrix.abi }}/libenet.so libenet.so

      - uses: actions/upload-artifact@v6
        with:
          name: enet-${{ matrix.target_dir }}
          path: c_enet/libenet.so

  build-ios-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_enet
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DENET_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release --target enet_static
          cp build/Release-iphoneos/libenet.a libenet.a

      - uses: actions/upload-artifact@v6
        with:
          name: enet-ios-arm64
          path: c_enet/libenet.a

  build-maccatalyst-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_enet
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DENET_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release --target enet_static
          cp build/Release/libenet.a libenet.a

      - uses: actions/upload-artifact@v6
        with:
          name: enet-maccatalyst-arm64
          path: c_enet/libenet.a

  build-tvos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_enet
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_OSX_SYSROOT=appletvos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DENET_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release --target enet_static
          cp build/Release-appletvos/libenet.a libenet.a

      - uses: actions/upload-artifact@v6
        with:
          name: enet-tvos-arm64
          path: c_enet/libenet.a

  build-watchos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_enet
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=watchOS \
            -DCMAKE_OSX_SYSROOT=watchos \
            -DCMAKE_OSX_ARCHITECTURES=arm64_32 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=7.0 \
            -DENET_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release --target enet_static
          cp build/Release-watchos/libenet.a libenet.a

      - uses: actions/upload-artifact@v6
        with:
          name: enet-watchos-arm64
          path: c_enet/libenet.a

  build-visionos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.x"

      - run: |
          cd c_enet
          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=visionOS \
            -DCMAKE_OSX_SYSROOT=xros \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=1.0 \
            -DENET_STATIC=1 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release --target enet_static
          cp build/Release-xros/libenet.a libenet.a

      - uses: actions/upload-artifact@v6
        with:
          name: enet-visionos-arm64
          path: c_enet/libenet.a

  package:
    needs:
      [
        build-linux,
        build-osx,
        build-win-x64,
        build-android,
        build-ios-arm64,
        build-maccatalyst-arm64,
        build-tvos-arm64,
        build-watchos-arm64,
        build-visionos-arm64,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - run: |
          mkdir -p dist/{linux-x64/native,linux-arm64/native,osx-x64/native,osx-arm64/native,win-x64/native,android-arm64/native,android-x64/native,ios-arm64/native,maccatalyst-arm64/native,tvos-arm64/native,watchos-arm64/native,visionos-arm64/native}

          cp artifacts/enet-linux-x64/libenet.so dist/linux-x64/native/
          cp artifacts/enet-linux-arm64/libenet.so dist/linux-arm64/native/

          cp artifacts/enet-osx-x64/libenet.dylib dist/osx-x64/native/
          cp artifacts/enet-osx-arm64/libenet.dylib dist/osx-arm64/native/

          cp artifacts/enet-win-x64/enet.dll dist/win-x64/native/
          cp artifacts/enet-win-x64/enet.lib dist/win-x64/native/

          cp artifacts/enet-android-arm64/libenet.so dist/android-arm64/native/
          cp artifacts/enet-android-x64/libenet.so dist/android-x64/native/

          cp artifacts/enet-ios-arm64/libenet.a dist/ios-arm64/native/
          cp artifacts/enet-maccatalyst-arm64/libenet.a dist/maccatalyst-arm64/native/
          cp artifacts/enet-tvos-arm64/libenet.a dist/tvos-arm64/native/
          cp artifacts/enet-watchos-arm64/libenet.a dist/watchos-arm64/native/
          cp artifacts/enet-visionos-arm64/libenet.a dist/visionos-arm64/native/

      - uses: actions/upload-artifact@v6
        with:
          name: enet-runtimes
          path: dist
